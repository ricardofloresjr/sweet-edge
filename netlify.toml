[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Preserve the existing .html URLs instead of rewriting them to extensionless URLs.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# The social acceptance white paper moved out of the logos folder; keep the legacy URL working.
[[redirects]]
  from = "/files/images/logos/Ricardos%20files/EDGE_White_Paper_Social_AcceptanceFINAL_compressed.pdf"
  to = "/files/pdf/White-Papers/EDGE_White_Paper_Social_AcceptanceFINAL_compressed.pdf"
  status = 301
