name: Build and publish website
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * *'
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.sweet-edge.ch' }}
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
          CMS_SITE_DOMAIN: ${{ vars.CMS_SITE_DOMAIN }}
          CMS_BRANCH: ${{ github.head_ref || github.ref_name }}
      - run: npm run check:build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    # Enable in repository settings only when the preview is approved and Pages
    # has been switched to GitHub Actions. Existing hosting stays untouched.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
