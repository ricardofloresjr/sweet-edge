<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — SWEET EDGE</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .error-page {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }
    .error-page .error-code {
      font-size: 6rem;
      font-weight: 700;
      color: #70B746;
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-page h1 {
      font-size: 1.75rem;
      color: #111827;
      margin-bottom: 12px;
    }
    .error-page p {
      color: #666;
      max-width: 460px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div data-include="partials/header.html"></div>

<main>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1>Page not found</h1>
      <p>
        The page you're looking for doesn't exist or may have moved.
        Try navigating from the home page or searching for what you need.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Go to home page</a>
        <a href="results/publications.html" class="btn btn-outline">Browse publications</a>
        <a href="contact.html" class="btn btn-outline">Contact us</a>
      </div>
    </div>
  </div>
</main>

<div data-include="partials/footer.html"></div>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
